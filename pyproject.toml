[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (unused imports/variables, undefined names)
    "I",        # import sorting
    "N",        # naming conventions
    "UP",       # modernize syntax for your Python version
    "B",        # bugbear: likely bugs
    "C4",       # cleaner comprehensions
    "SIM",      # simplifiable code
    "S",        # bandit security checks
    "PL",       # pylint rules
    "PGH",      # forces specific codes on `type: ignore`
    "RUF",      # Ruff-specific, including RUF100
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # asserts are fine in tests

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"