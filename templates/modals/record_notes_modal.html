<!--RECORD NOTES MODAL-->

<div class="modal fade" id="recordNotesModal" tabindex="-1" aria-labelledby="recordNotesLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">

        <!--MODAL CONTENT DIV SECTION-->
        <div class="modal-content">

            <!--MODAL HEADER DIV SECTION-->
            <div class="modal-header">
                <h2 class="modal-title h5" id="recordNotesLabel">Record Notes</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!--MODAL BODY DIV SECTION-->
            <div class="modal-body">
                <div id="recordNotesAlert" class="alert d-none" role="alert"></div>
                <form id="recordNotesForm" novalidate>
                    <!--INPUTS: TRADE_ID, EMOTIONS, MISTAKES, LESSONS, GENERAL_NOTES-->
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nt-trade-id" class="form-label">Trade ID</label>
                            <input type="number" class="form-control" id="nt-trade-id" name="trade_id" required>
                        </div>
                        <div class="col-md-6">
                            <label for="nt-emotions" class="form-label">Emotions</label>
                            <input type="text" class="form-control" id="nt-emotions" name="emotions" required>
                        </div>
                        <div class="col-md-6">
                            <label for="nt-mistakes" class="form-label">Mistakes</label>
                            <input type="text" class="form-control" id="nt-mistakes" name="mistakes" required>
                        </div>
                        <div class="col-md-6">
                            <label for="nt-lessons" class="form-label">Lessons</label>
                            <input type="text" class="form-control" id="nt-lessons" name="lessons" required>
                        </div>
                        <div class="col-md-6">
                            <label for="nt-general-notes" class="form-label">General Notes</label>
                            <input type="text" class="form-control" id="nt-general-notes" name="general_notes" required>
                        </div>
                    </div>
                </form>
            </div>

            <!--MODAL FOOTER DIV SECTION-->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" form="recordNotesForm">Record Notes</button>
            </div>
        </div>

    </div>
</div>
