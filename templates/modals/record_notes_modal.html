<!--RECORD NOTES MODAL-->
<!--IDs, names and form id are unchanged from the old version, so recordNotes.js works without edits.-->
<!--Free-form notes use <textarea> instead of <input type="text">, one field per row so each gets full width.-->

<div class="modal fade" id="recordNotesModal" tabindex="-1" aria-labelledby="recordNotesLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">

        <!--MODAL CONTENT DIV SECTION-->
        <div class="modal-content">

            <!--MODAL HEADER DIV SECTION-->
            <div class="modal-header">
                <h2 class="modal-title h5" id="recordNotesLabel">Record Notes</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!--MODAL BODY DIV SECTION-->
            <div class="modal-body">
                <div id="recordNotesAlert" class="alert d-none" role="alert"></div>

                <form id="recordNotesForm" novalidate>
                    <!--INPUTS: TRADE_ID, EMOTIONS, MISTAKES, LESSONS, GENERAL_NOTES-->
                    <div class="row g-3">

                        <div class="col-md-4">
                            <label for="nt-trade-id" class="form-label">Trade ID</label>
                            <input type="number" min="1" class="form-control" id="nt-trade-id" name="trade_id" required>
                            <div class="invalid-feedback">Enter a valid trade ID.</div>
                        </div>

                        <div class="col-12">
                            <label for="nt-emotions" class="form-label">Emotions</label>
                            <textarea class="form-control" id="nt-emotions" name="emotions" rows="5"
                                      placeholder="How did you feel before, during and after the trade?" required></textarea>
                            <div class="invalid-feedback">Describe how you felt.</div>
                        </div>

                        <div class="col-12">
                            <label for="nt-mistakes" class="form-label">Mistakes</label>
                            <textarea class="form-control" id="nt-mistakes" name="mistakes" rows="5"
                                      placeholder="What went wrong? Write &quot;none&quot; if nothing did." required></textarea>
                            <div class="invalid-feedback">Describe any mistakes, or write "none".</div>
                        </div>

                        <div class="col-12">
                            <label for="nt-lessons" class="form-label">Lessons</label>
                            <textarea class="form-control" id="nt-lessons" name="lessons" rows="5"
                                      placeholder="What will you do differently next time?" required></textarea>
                            <div class="invalid-feedback">Write what you learned.</div>
                        </div>

                        <div class="col-12">
                            <label for="nt-general-notes" class="form-label">General notes</label>
                            <textarea class="form-control" id="nt-general-notes" name="general_notes" rows="8"
                                      placeholder="Market context, setup details, anything else worth remembering." required></textarea>
                            <div class="invalid-feedback">Add a general note.</div>
                        </div>

                    </div>
                </form>
            </div>

            <!--MODAL FOOTER DIV SECTION-->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" form="recordNotesForm">Record Notes</button>
            </div>
        </div>

    </div>
</div>
