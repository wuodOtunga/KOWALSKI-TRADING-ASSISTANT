<!--RECORD PARAMETERS MODAL-->

<div class="modal fade" id="recordParametersModal" tabindex="-1" aria-labelledby="recordParametersLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <h2 class="modal-title h5" id="recordParametersLabel">Record Parameters</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <div id="recordParametersAlert" class="alert d-none" role="alert"></div>

                <form id="recordParametersForm" novalidate>
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="pt-trade-id" class="form-label">Trade ID</label>
                            <input type="number" min="1" class="form-control"
                                   id="pt-trade-id" name="trade_id" required>
                            <div class="invalid-feedback">Enter a valid trade ID.</div>
                        </div>

                        <div class="col-12">
                            <div class="form-label mb-2">Parameters present in this trade</div>

                            <!--JS REPLACES THE SPINNER WITH CHECKBOXES-->
                            <div id="pt-parameters-list" class="row row-cols-1 row-cols-md-2 g-2">
                                <div class="col">
                                    <div class="spinner-border spinner-border-sm" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </div>
                            </div>

                            <div class="form-text">
                                Leave all unchecked if none were present. Submitting also grades the trade,
                                and a trade can only be graded once.
                            </div>
                        </div>

                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" form="recordParametersForm">Record Parameters</button>
            </div>

        </div>
    </div>
</div>
