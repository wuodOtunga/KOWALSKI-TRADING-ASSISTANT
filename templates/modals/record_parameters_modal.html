<!--RECORD PARAMETERS MODAL-->

<div class="modal fade" id="recordParametersModal" tabindex="-1" aria-labelledby="recordParametersLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">

        <!--MODAL CONTENT DIV SECTION-->
        <div class="modal-content">

            <!--MODAL HEADER DIV SECTION-->
            <div class="modal-header">
                <h2 class="modal-title h5" id="recordParametersLabel">Record Parameters</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!--MODAL BODY DIV SECTION-->
            <div class="modal-body">
                <div id="recordParametersAlert" class="alert d-none" role="alert"></div>
                <form id="recordParametersForm" novalidate>
                    <!--INPUTS: DROPDOWN SELECT BOX WITH 8 OPTIONS-->
                    <!--INPUTS POPULATED BY JAVASCRIPT HANDLER CODE-->
                    <!--FIND OUT ELEMENT FOR MULTI-SELECT AND THE NAME ATTRIBUTE-->
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="pt-trade-id" class="form-label">Trade ID</label>
                            <input type="number" class="form-control" id="pt-trade-id" name="trade_id" required>
                        </div>
                        <fieldset class="col-12">
                            <legend class="form-label fs-6">Parameters present</legend>
                            <div id="pt-parameters" class="row row-cols-1 row-cols-md-2 g-2">
                                <!-- checkboxes injected by JS -->
                            </div>
                        </fieldset>
                    </div>
                </form>
            </div>

            <!--MODAL FOOTER DIV SECTION-->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" form="recordParametersForm">Record Parameters</button>
            </div>
        </div>

    </div>
</div>
