<!--RECORD CHARTS MODAL-->

<div class="modal fade" id="recordChartsModal" tabindex="-1" aria-labelledby="recordChartsLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h2 class="modal-title h5" id="recordChartsLabel">Record Charts</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <div id="recordChartsAlert" class="alert d-none" role="alert"></div>
                <!--FORM INPUTS: TRADE_ID, CHARTS-->
                <form id="recordchartsForm" novalidate>
                    <input type="number" name="trade_id" required>
                    <input type="file" name="charts" accept="image/*" multiple required>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" form="recordChartsForm">Record Charts</button>
            </div>

        </div>
    </div>
</div>
